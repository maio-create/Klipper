<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace client — Kizeo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --purple:#471D7A;--purple2:#5B2D96;--purple-light:#F0EAF9;
  --blue:#5B8DEF;--blue-bg:#EEF3FE;
  --orange:#F0A04B;--orange-bg:#FEF3E6;
  --green:#4BAE8A;--green-bg:#E6F5EE;
  --red:#DC2626;--red-bg:#FEE2E2;
  --gray:#A0AEC0;--gray-bg:#F1F5F9;
  --border:#E8E5DF;--text:#1A1A1A;--text2:#6B6B6B;--text3:#9B9B9B;
  --bg:#F5F4F1;--white:#FFFFFF;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);
  --shadow-md:0 4px 20px rgba(0,0,0,0.10);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;}

/* ACCESS */
.access-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#2D1250 0%,var(--purple) 60%,#6B3FA0 100%);padding:20px;}
.access-card{background:var(--white);border-radius:24px;padding:48px 44px;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,0.35);text-align:center;}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px;}
.brand-name{font-size:22px;font-weight:700;color:var(--purple);letter-spacing:.5px;}
.access-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:8px;}
.access-sub{font-size:13px;color:var(--text3);margin-bottom:28px;line-height:1.6;}
.access-inp{width:100%;border:2px solid var(--border);border-radius:12px;padding:13px 16px;font-size:15px;color:var(--text);outline:none;font-family:monospace;letter-spacing:2px;text-align:center;background:#FAFAF9;transition:border-color .15s;margin-bottom:12px;}
.access-inp:focus{border-color:var(--purple);background:var(--white);}
.access-btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--purple);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;font-family:inherit;}
.access-btn:hover{opacity:.88;}
.access-err{font-size:12px;color:var(--red);margin-top:8px;padding:8px 12px;background:var(--red-bg);border-radius:8px;display:none;}

/* HEADER */
.app{display:none;}
.app.on{display:flex;flex-direction:column;min-height:100vh;}
.hdr{background:var(--purple);height:58px;display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(71,29,122,.3);}
.hdr-brand{display:flex;align-items:center;gap:9px;}
.hdr-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:.5px;}
.hdr-sep{width:1px;height:22px;background:rgba(255,255,255,.2);}
.hdr-client{font-size:13px;color:rgba(255,255,255,.65);}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(75,174,138,.2);}
.hdr-btn{font-size:11px;padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.65);cursor:pointer;font-family:inherit;transition:all .13s;}
.hdr-btn:hover{background:rgba(255,255,255,.12);color:#fff;}

/* MAIN */
.main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:28px 20px 48px;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px;}
.stat-box{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);}
.stat-n{font-size:28px;font-weight:700;line-height:1;margin-bottom:4px;}
.stat-l{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:500;}

/* SECTION HEADERS */
.section-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;margin-top:32px;}
.section-hdr:first-of-type{margin-top:0;}
.section-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.section-ttl{font-size:16px;font-weight:600;color:var(--text);}
.section-sub{font-size:12px;color:var(--text3);margin-left:auto;}
.divider{height:1px;background:var(--border);margin:28px 0;}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:flex-start;}
.kb-col{border-radius:14px;overflow:hidden;background:var(--white);border:1px solid var(--border);box-shadow:var(--shadow);}
.kb-col-hdr{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);}
.kb-col-bar{width:100%;height:3px;display:block;}
.kb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.kb-col-ttl{font-size:12px;font-weight:600;color:var(--text);flex:1;}
.kb-cnt{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
.kb-body{padding:8px;}
.kb-card{background:#FAFAF9;border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:7px;}
.kb-card:last-child{margin-bottom:0;}
.kb-card-title{font-size:13px;font-weight:400;color:var(--text);line-height:1.4;margin-bottom:4px;}
.kb-card-date{font-size:10px;color:var(--text3);}
.kb-empty{padding:20px;text-align:center;font-size:12px;color:var(--text3);font-style:italic;}
.kb-section-client{margin-bottom:20px;}
.kb-section-hdr-client{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px 10px 0 0;background:var(--white);border:1px solid var(--border);border-left:4px solid var(--border);cursor:pointer;user-select:none;}
.kb-section-dot-client{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.kb-section-ttl-client{font-size:13px;font-weight:700;color:var(--text);flex:1;}
.kb-section-cnt-client{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
.kb-section-body-client{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px;background:var(--bg);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;}
.kb-empty{padding:20px;text-align:center;font-size:12px;color:var(--text3);font-style:italic;}
@media(max-width:700px){.kb-section-body-client{grid-template-columns:1fr;}}

/* DEMANDES */
.dem-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start;}
.dem-status-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;padding-top:2px;}
.dem-status-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.dem-status-lbl{font-size:10px;font-weight:600;text-align:center;line-height:1.2;}
.dem-body{flex:1;}
.dem-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px;line-height:1.4;}
.dem-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:8px;}
.dem-meta{font-size:11px;color:var(--text3);}
.dem-reason{background:var(--gray-bg);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text2);margin-top:8px;border-left:3px solid var(--gray);}
.dem-reason.accepted{background:var(--green-bg);border-left-color:var(--green);color:#1A6B45;}

/* SUBMIT BTN */
.submit-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.submit-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border:none;border-radius:10px;background:var(--purple);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;box-shadow:0 2px 8px rgba(71,29,122,.3);}
.submit-btn:hover{opacity:.88;}
.empty-state{text-align:center;padding:36px 20px;color:var(--text3);}
.empty-state-title{font-size:14px;font-weight:500;color:var(--text2);margin:10px 0 4px;}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.ov.open{display:flex;}
.modal-sheet{background:var(--white);border-radius:24px 24px 0 0;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;padding:28px 24px 40px;animation:up .25s ease;}
@keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.modal-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--text3);margin-bottom:22px;line-height:1.5;}
.field-lbl{display:block;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.field-inp{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;outline:none;font-family:inherit;transition:border-color .15s;margin-bottom:14px;background:#FAFAF9;}
.field-inp:focus{border-color:var(--purple);background:var(--white);}
textarea.field-inp{resize:vertical;min-height:90px;line-height:1.5;}
.modal-err{font-size:12px;color:var(--red);padding:8px 12px;background:var(--red-bg);border-radius:8px;margin-bottom:12px;display:none;}
.modal-submit{width:100%;padding:13px;border:none;border-radius:12px;background:var(--purple);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.modal-submit:hover{opacity:.88;}
.modal-success{text-align:center;padding:24px 0;display:none;}
.modal-success-icon{font-size:44px;margin-bottom:12px;}
.modal-success-title{font-size:16px;font-weight:600;color:var(--green);margin-bottom:6px;}
.modal-success-sub{font-size:13px;color:var(--text3);}

/* LOADER */
.loader-wrap{display:flex;align-items:center;justify-content:center;padding:40px;gap:12px;color:var(--text3);}
.spinner{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:600px){
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .kanban{grid-template-columns:1fr;}
  .main{padding:16px 14px 40px;}
  .hdr{padding:0 16px;}
  .access-card{padding:36px 24px;}
}
</style>
</head>
<body>

<!-- ACCESS -->
<div class="access-screen" id="access-screen">
  <div class="access-card">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 34 34" fill="none"><path d="M4 4L30 4L30 30L4 30L4 10L24 10L24 26L8 26L8 14L20 14L20 22L11 22L11 17L17 17L17 19" stroke="#471D7A" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="17" cy="19" r="1.5" fill="#471D7A"/></svg>
      <span class="brand-name">KLIPPER</span>
    </div>
    <div class="access-title">Espace client</div>
    <div class="access-sub">Consultez vos demandes et leur avancement en temps reel.</div>
    <input class="access-inp" type="text" id="acc-inp" placeholder="Votre code acces" autocomplete="off" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')doAccess()">
    <button class="access-btn" onclick="doAccess()">Acceder a mon espace</button>
    <div class="access-err" id="acc-err">Code invalide. Contactez votre interlocuteur Kizeo.</div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="hdr">
    <div class="hdr-brand">
      <svg width="22" height="22" viewBox="0 0 34 34" fill="none"><path d="M4 4L30 4L30 30L4 30L4 10L24 10L24 26L8 26L8 14L20 14L20 22L11 22L11 17L17 17L17 19" stroke="white" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="17" cy="19" r="1.5" fill="white"/></svg>
      <span class="hdr-name">KLIPPER</span>
    </div>
    <div class="hdr-sep"></div>
    <span class="hdr-client" id="hdr-client"></span>
    <div class="hdr-right">
      <div class="live-dot" id="live-dot"></div>
      <button class="hdr-btn" onclick="doLogout()">Deconnexion</button>
    </div>
  </div>

  <div class="main">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-box"><div class="stat-n" id="s-total">-</div><div class="stat-l">Demandes</div></div>
      <div class="stat-box"><div class="stat-n" style="color:var(--blue)" id="s-open">-</div><div class="stat-l">A traiter</div></div>
      <div class="stat-box"><div class="stat-n" style="color:var(--orange)" id="s-test">-</div><div class="stat-l">En test</div></div>
      <div class="stat-box"><div class="stat-n" style="color:var(--green)" id="s-done">-</div><div class="stat-l">Livrees</div></div>
    </div>

    <!-- Section: tickets -->
    <div class="section-hdr">
      <div class="section-icon" style="background:var(--purple-light);">📋</div>
      <div>
        <div class="section-ttl">Suivi de vos tickets</div>
      </div>
    </div>

    <div class="kanban" id="kanban">
      <div id="kb-sections-client"></div>
