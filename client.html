<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi de vos demandes — KLIPPER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root{
  --bg:#F7F6F3;
  --bg2:#FFFFFF;
  --border:#E8E5DF;
  --text:#1A1A1A;
  --text2:#6B6B6B;
  --text3:#9B9B9B;
  --accent:#471D7A;
  --accent-light:#F0EAF9;
  --green:#1A6B45;
  --green-bg:#E6F5EE;
  --orange:#C07830;
  --orange-bg:#FEF3E6;
  --red:#B91C1C;
  --red-bg:#FEE2E2;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);
  --shadow-lg:0 4px 24px rgba(0,0,0,0.10);
  --r:12px;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  min-height:100vh;
  font-weight:400;
}

/* ── ACCESS SCREEN ── */
.access-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:linear-gradient(135deg,#471D7A 0%,#2D1250 100%);
}
.access-box{
  background:#fff;
  border-radius:20px;
  padding:48px 44px;
  width:100%;
  max-width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  text-align:center;
}
.access-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:32px;
}
.access-logo svg{opacity:.85;}
.access-logo-name{
  font-size:22px;
  font-weight:600;
  color:#471D7A;
  letter-spacing:1px;
}
.access-title{font-size:18px;font-weight:500;color:var(--text);margin-bottom:8px;}
.access-sub{font-size:13px;color:var(--text3);margin-bottom:28px;line-height:1.6;}
.access-input{
  width:100%;
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:12px 16px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  color:var(--text);
  outline:none;
  transition:border-color .15s;
  text-align:center;
  letter-spacing:2px;
  background:var(--bg);
  margin-bottom:12px;
}
.access-input:focus{border-color:var(--accent);}
.access-btn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:#fff;
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:opacity .15s;
  margin-bottom:10px;
}
.access-btn:hover{opacity:.85;}
.access-err{font-size:12px;color:var(--red);margin-top:6px;display:none;}

/* ── MAIN LAYOUT ── */
.main-screen{display:none;}
.main-screen.visible{display:block;}

/* ── HEADER ── */
.header{
  background:var(--accent);
  color:#fff;
  padding:0 32px;
  height:60px;
  display:flex;
  align-items:center;
  gap:16px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 12px rgba(71,29,122,0.3);
}
.header-logo{display:flex;align-items:center;gap:10px;}
.header-logo-name{font-size:16px;font-weight:600;letter-spacing:1px;}
.header-sep{width:1px;height:24px;background:rgba(255,255,255,0.2);}
.header-client{font-size:14px;font-weight:400;color:rgba(255,255,255,0.75);}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.sync-badge{
  font-size:11px;
  padding:4px 10px;
  border-radius:20px;
  background:rgba(255,255,255,0.15);
  color:rgba(255,255,255,0.8);
}
.logout-btn{
  font-size:11px;padding:5px 12px;border-radius:8px;
  border:1px solid rgba(255,255,255,0.25);background:transparent;
  color:rgba(255,255,255,0.7);cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:all .13s;
}
.logout-btn:hover{background:rgba(255,255,255,0.1);color:#fff;}

/* ── CONTENT ── */
.content{max-width:900px;margin:0 auto;padding:32px 24px;}

/* ── STATS BAR ── */
.stats-bar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:28px;
}
.stat-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:16px 20px;
  box-shadow:var(--shadow);
}
.stat-num{font-size:28px;font-weight:600;color:var(--text);line-height:1;margin-bottom:4px;}
.stat-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
.stat-card.highlight .stat-num{color:var(--accent);}

/* ── FILTERS ── */
.filter-bar{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.filter-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-right:4px;}
.fbtn{
  padding:5px 14px;
  border-radius:20px;
  border:1.5px solid var(--border);
  background:transparent;
  color:var(--text2);
  font-size:12px;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;
  transition:all .12s;
  font-weight:500;
}
.fbtn:hover{border-color:var(--accent);color:var(--accent);}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ── TICKET LIST ── */
.section-title{
  font-size:13px;font-weight:500;color:var(--text2);
  text-transform:uppercase;letter-spacing:.7px;
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.section-title span{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:20px;padding:1px 8px;font-size:11px;color:var(--text3);
  text-transform:none;letter-spacing:0;
}

.ticket-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:18px 20px;
  margin-bottom:10px;
  box-shadow:var(--shadow);
  transition:box-shadow .15s,transform .15s;
  cursor:pointer;
}
.ticket-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}

.ticket-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ticket-id{
  font-family:'DM Mono',monospace;
  font-size:10px;color:var(--text3);font-weight:500;
}
.ticket-prod{
  padding:2px 8px;border-radius:4px;
  font-size:10px;font-weight:600;
}
.prod-klear{background:#FFB300;color:#fff;}
.prod-karre{background:#FF5721;color:#fff;}
.ticket-date{margin-left:auto;font-size:11px;color:var(--text3);}

.ticket-title{
  font-size:14px;font-weight:500;color:var(--text);
  line-height:1.4;margin-bottom:10px;
}

.ticket-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

.status-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:20px;
  font-size:11px;font-weight:500;
}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

.prio-badge{
  padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;
}
.prio-urg{background:#FEE2E2;color:#B91C1C;}
.prio-moy{background:#FEF3C7;color:#92400E;}
.prio-fai{background:#E6F5EE;color:#1A6B45;}

.cmt-count{
  margin-left:auto;
  font-size:11px;color:var(--text3);
  display:flex;align-items:center;gap:4px;
}

/* ── TICKET DETAIL ── */
.ov{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.4);
  z-index:500;
  display:none;
  align-items:flex-end;
  justify-content:center;
  backdrop-filter:blur(4px);
}
.ov.open{display:flex;}
.det-panel{
  background:var(--bg2);
  border-radius:20px 20px 0 0;
  width:100%;max-width:640px;
  max-height:85vh;
  overflow-y:auto;
  padding:28px 28px 40px;
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.det-handle{
  width:40px;height:4px;background:var(--border);
  border-radius:2px;margin:0 auto 20px;
}
.det-title{font-size:18px;font-weight:500;color:var(--text);line-height:1.4;margin-bottom:12px;}
.det-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.det-desc{
  font-size:13px;color:var(--text2);line-height:1.7;
  margin-bottom:20px;
  white-space:pre-wrap;
}
.det-desc-empty{font-size:13px;color:var(--text3);font-style:italic;}

.det-section-title{
  font-size:11px;font-weight:600;color:var(--text3);
  text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:10px;
}
.cmt-item{
  padding:10px 14px;background:var(--bg);
  border-radius:8px;margin-bottom:6px;
}
.cmt-author{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:3px;}
.cmt-text{font-size:13px;color:var(--text);line-height:1.5;}
.cmt-date{font-size:10px;color:var(--text3);margin-top:3px;}

/* Photos */
.photos-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.photo-thumb{width:80px;height:80px;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.photo-lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain;}

.close-btn{
  position:absolute;top:20px;right:20px;
  width:32px;height:32px;border-radius:50%;
  background:var(--bg);border:1px solid var(--border);
  font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--text2);transition:all .12s;
}
.close-btn:hover{background:var(--border);}

/* ── PROGRESS ── */
.progress-section{margin-bottom:24px;}
.progress-steps{
  display:flex;align-items:center;gap:0;
  overflow-x:auto;padding:4px 0;
}
.step{
  display:flex;flex-direction:column;align-items:center;
  flex:1;min-width:80px;position:relative;
}
.step::before{
  content:'';position:absolute;top:14px;left:50%;right:-50%;
  height:2px;background:var(--border);z-index:0;
}
.step:last-child::before{display:none;}
.step-dot{
  width:28px;height:28px;border-radius:50%;
  background:var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;z-index:1;position:relative;
  transition:all .2s;border:2px solid var(--border);
}
.step.done .step-dot{background:var(--green);border-color:var(--green);color:#fff;}
.step.current .step-dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-light);}
.step-lbl{font-size:9px;color:var(--text3);margin-top:6px;text-align:center;max-width:70px;line-height:1.3;}
.step.current .step-lbl{color:var(--accent);font-weight:600;}
.step.done .step-lbl{color:var(--green);}

/* ── EMPTY ── */
.empty-state{
  text-align:center;padding:60px 24px;
  color:var(--text3);
}
.empty-state svg{opacity:.3;margin-bottom:16px;}
.empty-title{font-size:16px;font-weight:500;color:var(--text2);margin-bottom:8px;}
.empty-sub{font-size:13px;}

/* Loading */
.loader-screen{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:200px;gap:12px;color:var(--text3);
}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:600px){
  .stats-bar{grid-template-columns:repeat(2,1fr);}
  .header{padding:0 16px;}
  .content{padding:20px 16px;}
  .det-panel{border-radius:16px 16px 0 0;}
}
</style>
</head>
<body>

<!-- ACCESS SCREEN -->
<div class="access-screen" id="access-screen">
  <div class="access-box">
    <div class="access-logo">
      <svg width="32" height="32" viewBox="0 0 34 34" fill="none">
        <path d="M4 4 L30 4 L30 30 L4 30 L4 10 L24 10 L24 26 L8 26 L8 14 L20 14 L20 22 L11 22 L11 17 L17 17 L17 19" stroke="#471D7A" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/>
        <circle cx="17" cy="19" r="1.5" fill="#471D7A"/>
      </svg>
      <span class="access-logo-name">KLIPPER</span>
    </div>
    <div class="access-title">Suivi de vos demandes</div>
    <div class="access-sub">Entrez votre code d'accès pour consulter l'état de vos demandes en cours.</div>
    <input class="access-input" type="text" id="access-token" placeholder="CODE-XXXX" autocomplete="off" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')doAccess()">
    <button class="access-btn" onclick="doAccess()">Accéder →</button>
    <div class="access-err" id="access-err">Code invalide ou expiré. Contactez Kizeo.</div>
  </div>
</div>

<!-- MAIN SCREEN -->
<div class="main-screen" id="main-screen">
  <div class="header">
    <div class="header-logo">
      <svg width="24" height="24" viewBox="0 0 34 34" fill="none">
        <path d="M4 4 L30 4 L30 30 L4 30 L4 10 L24 10 L24 26 L8 26 L8 14 L20 14 L20 22 L11 22 L11 17 L17 17 L17 19" stroke="white" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
        <circle cx="17" cy="19" r="1.5" fill="white"/>
      </svg>
      <span class="header-logo-name">KLIPPER</span>
    </div>
    <div class="header-sep"></div>
    <div class="header-client" id="header-client">Suivi client</div>
    <div class="header-right">
      <span class="sync-badge" id="sync-badge">Chargement…</span>
      <button class="logout-btn" onclick="doLogout()">Se déconnecter</button>
    </div>
  </div>

  <div class="content">
    <!-- Stats -->
    <div class="stats-bar" id="stats-bar">
      <div class="stat-card highlight"><div class="stat-num" id="stat-total">0</div><div class="stat-lbl">Demandes</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-open" style="color:#D97706">0</div><div class="stat-lbl">En cours</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-done" style="color:#1A6B45">0</div><div class="stat-lbl">Livrées</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-urg" style="color:#B91C1C">0</div><div class="stat-lbl">Urgentes</div></div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <span class="filter-lbl">Statut</span>
      <button class="fbtn on" data-f="all" onclick="setFilter('all',this)">Tous</button>
      <button class="fbtn" data-f="open" onclick="setFilter('open',this)">En cours</button>
      <button class="fbtn" data-f="done" onclick="setFilter('done',this)">Livrés</button>
    </div>

    <!-- Ticket list -->
    <div id="ticket-list"><div class="loader-screen"><div class="spinner"></div><span>Chargement de vos demandes…</span></div></div>
  </div>
</div>

<!-- TICKET DETAIL -->
<div class="ov" id="ov-det" onclick="if(event.target===this)closeDet()">
  <div class="det-panel" id="det-panel">
    <div class="det-handle"></div>
    <div id="det-content"></div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDReuFdkQd66n1fIykQh34aZLgL7EwFaF4",
  authDomain: "kizeo-crm-afcc3.firebaseapp.com",
  projectId: "kizeo-crm-afcc3",
  storageBucket: "kizeo-crm-afcc3.firebasestorage.app",
  messagingSenderId: "813281317162",
  appId: "1:813281317162:web:c0f557690861fdbe378e53"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window._fb = { db, collection, getDocs, query, where, onSnapshot };
window._fbReady = true;
window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
// ── STATE ──
let clientData = null; // {name, token}
let tickets = [];
let filter = 'all';
const TOKEN_KEY = 'klp_client_token';

// Status display config
const STATUS_LABELS = {
  afaire:    {label:'À faire',     color:'#5B8DEF', final:false},
  attente:   {label:'En attente',  color:'#F0A04B', final:false},
  prevenir:  {label:'En cours',    color:'#9B72D4', final:false},
  livre:     {label:'Livré',       color:'#4BAE8A', final:true},
  refuse:    {label:'Refusé',      color:'#A0AEC0', final:true},
  standby:   {label:'Stand by',    color:'#B8C4D4', final:false},
};
const STATUS_ORDER = ['afaire','prevenir','attente','livre'];

function stLabel(id){ return STATUS_LABELS[id]?.label||id; }
function stColor(id){ return STATUS_LABELS[id]?.color||'#ccc'; }
function stFinal(id){ return STATUS_LABELS[id]?.final||false; }

function prodBadge(prod){
  if(prod==='karre') return '<span class="ticket-prod prod-karre">KARRÉ</span>';
  return '<span class="ticket-prod prod-klear">KLEAR</span>';
}
function prioBadge(p){
  if(p==='urgente') return '<span class="prio-badge prio-urg">Urgente</span>';
  if(p==='moyenne') return '<span class="prio-badge prio-moy">Moyenne</span>';
  return '<span class="prio-badge prio-fai">Faible</span>';
}
function timeAgo(iso){
  if(!iso)return'';
  const d=Math.floor((Date.now()-new Date(iso))/86400000);
  if(d<1)return'Aujourd\'hui';
  if(d===1)return'Hier';
  if(d<30)return'Il y a '+d+' j';
  return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
}
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── ACCESS ──
function doAccess(){
  const token = document.getElementById('access-token').value.trim().toUpperCase();
  if(!token){ showErr('Entrez votre code d\'accès.'); return; }
  if(!window._fbReady){ showErr('Connexion en cours…'); return; }
  loadClientByToken(token);
}

async function loadClientByToken(token){
  const btn = document.querySelector('.access-btn');
  btn.textContent = 'Vérification…'; btn.disabled = true;
  const errEl = document.getElementById('access-err');
  errEl.style.display = 'none';
  try{
    const {db, collection, getDocs} = window._fb;
    const snap = await getDocs(collection(db, 'klipper_tokens'));
    let found = null;
    snap.forEach(d => {
      const data = d.data();
      if(data.token === token) found = data;
    });
    if(!found){
      showErr('Code invalide ou expiré. Contactez Kizeo.');
      btn.textContent = 'Accéder →'; btn.disabled = false;
      return;
    }
    // Valid token
    clientData = found;
    localStorage.setItem(TOKEN_KEY, token);
    enterApp();
  } catch(e){
    showErr('Erreur de connexion. Réessayez.');
    btn.textContent = 'Accéder →'; btn.disabled = false;
  }
}

function showErr(msg){
  const el = document.getElementById('access-err');
  el.textContent = msg; el.style.display = 'block';
}

function enterApp(){
  document.getElementById('access-screen').style.display = 'none';
  document.getElementById('main-screen').classList.add('visible');
  document.getElementById('header-client').textContent = clientData.name;
  loadTickets();
}

function doLogout(){
  if(_unsubscribe){ _unsubscribe(); _unsubscribe = null; }
  localStorage.removeItem(TOKEN_KEY);
  clientData = null; tickets = []; _openDetId = null;
  document.getElementById('access-screen').style.display = 'flex';
  document.getElementById('main-screen').classList.remove('visible');
  document.getElementById('access-token').value = '';
}

// ── CHECK SESSION ──
function checkSession(){
  const saved = localStorage.getItem(TOKEN_KEY);
  if(saved && window._fbReady){ loadClientByToken(saved); }
}

// ── LOAD TICKETS (realtime) ──
let _unsubscribe = null;

function loadTickets(){
  document.getElementById('sync-badge').textContent = 'Chargement…';
  // Unsubscribe previous listener if any
  if(_unsubscribe){ _unsubscribe(); _unsubscribe = null; }
  const {db, collection, onSnapshot} = window._fb;
  const clientName = (clientData.name||'').toLowerCase();
  _unsubscribe = onSnapshot(
    collection(db, 'klipper_tickets'),
    function(snap){
      const allTix = [];
      snap.forEach(d => allTix.push(d.data()));
      tickets = allTix.filter(function(t){
        return t.origine === 'client' &&
               (t.client||'').toLowerCase() === clientName;
      });
      tickets.sort(function(a,b){
        return new Date(b.updated||b.created) - new Date(a.updated||a.created);
      });
      updateStats();
      renderTickets();
      document.getElementById('sync-badge').textContent = '✓ À jour';
      const badge = document.getElementById('sync-badge');
      badge.style.background = 'rgba(75,174,138,0.3)';
      setTimeout(function(){ badge.style.background = ''; }, 1500);
      // Refresh open detail if any
      if(document.getElementById('ov-det').classList.contains('open') && _openDetId){
        openDet(_openDetId);
      }
    },
    function(e){
      document.getElementById('sync-badge').textContent = 'Erreur réseau';
      document.getElementById('ticket-list').innerHTML = '<div class="loader-screen"><span>Impossible de charger les données.</span></div>';
    }
  );
}

// ── STATS ──
function updateStats(){
  const open = tickets.filter(t => !stFinal(t.status)).length;
  const done = tickets.filter(t => stFinal(t.status)).length;
  const urg  = tickets.filter(t => t.prio === 'urgente').length;
  document.getElementById('stat-total').textContent = tickets.length;
  document.getElementById('stat-open').textContent  = open;
  document.getElementById('stat-done').textContent  = done;
  document.getElementById('stat-urg').textContent   = urg;
}

// ── FILTER ──
function setFilter(f, btn){
  filter = f;
  document.querySelectorAll('.filter-bar .fbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderTickets();
}

function getFiltered(){
  if(filter === 'open') return tickets.filter(t => !stFinal(t.status));
  if(filter === 'done') return tickets.filter(t =>  stFinal(t.status));
  return tickets;
}

// ── RENDER TICKETS ──
function renderTickets(){
  const list = document.getElementById('ticket-list');
  const shown = getFiltered();
  if(!shown.length){
    list.innerHTML = '<div class="empty-state">'+
      '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M8 8h8M8 16h5"/></svg>'+
      '<div class="empty-title">Aucune demande trouvée</div>'+
      '<div class="empty-sub">Aucune demande ne correspond à ce filtre.</div>'+
    '</div>';
    return;
  }

  // Group by status: open first, then done
  const open = shown.filter(t => !stFinal(t.status));
  const done = shown.filter(t =>  stFinal(t.status));

  let html = '';
  if(open.length){
    html += '<div class="section-title">En cours <span>'+open.length+'</span></div>';
    html += open.map(renderCard).join('');
  }
  if(done.length){
    if(open.length) html += '<div style="margin-top:24px"></div>';
    html += '<div class="section-title">Terminées <span>'+done.length+'</span></div>';
    html += done.map(renderCard).join('');
  }
  list.innerHTML = html;
}

function tc(id){ return 'KLP-'+String(id).padStart(4,'0'); }

function renderCard(t){
  const statusCol = stColor(t.status);
  const cmtCount  = (t.comments||[]).length;
  return '<div class="ticket-card" onclick="openDet('+t.id+')">'+
    '<div class="ticket-top">'+
      '<span class="ticket-id">'+tc(t.id)+'</span>'+
      prodBadge(t.prod||'klear')+
      '<span class="ticket-date">'+timeAgo(t.updated||t.created)+'</span>'+
    '</div>'+
    '<div class="ticket-title">'+esc(t.title)+'</div>'+
    '<div class="ticket-footer">'+
      '<span class="status-badge" style="background:'+statusCol+'22;color:'+statusCol+'">'+
        '<span class="status-dot" style="background:'+statusCol+'"></span>'+
        stLabel(t.status)+
      '</span>'+
      prioBadge(t.prio)+
      (cmtCount ? '<span class="cmt-count">💬 '+cmtCount+'</span>' : '')+
    '</div>'+
  '</div>';
}

// ── PROGRESS STEPS ──
function renderProgress(t){
  const steps = STATUS_ORDER;
  const curIdx = steps.indexOf(t.status);
  return '<div class="progress-section">'+
    '<div class="det-section-title">Progression</div>'+
    '<div class="progress-steps">'+
    steps.map((s,i) => {
      const done    = i < curIdx || (stFinal(t.status) && s==='livre' && t.status==='livre');
      const current = i === curIdx;
      const cls     = done ? 'done' : current ? 'current' : '';
      const icon    = done ? '✓' : current ? (i+1) : (i+1);
      return '<div class="step '+cls+'">'+
        '<div class="step-dot">'+icon+'</div>'+
        '<div class="step-lbl">'+stLabel(s)+'</div>'+
      '</div>';
    }).join('')+
    '</div>'+
  '</div>';
}

// ── TICKET DETAIL ──
let _openDetId = null;
function openDet(id){
  _openDetId = id;
  const t = tickets.find(x => x.id === id);
  if(!t) return;
  const statusCol = stColor(t.status);
  const cmts = (t.comments||[]);
  const imgs = (t.images||[]);

  let html = '';
  html += '<div class="det-badges">'+
    prodBadge(t.prod||'klear')+
    '<span class="status-badge" style="background:'+statusCol+'22;color:'+statusCol+'">'+
      '<span class="status-dot" style="background:'+statusCol+'"></span>'+
      stLabel(t.status)+
    '</span>'+
    prioBadge(t.prio)+
    '<span style="font-size:11px;color:var(--text3);margin-left:4px">'+tc(t.id)+'</span>'+
  '</div>';

  html += '<div class="det-title">'+esc(t.title)+'</div>';

  html += renderProgress(t);

  if(t.desc){
    html += '<div class="det-section-title">Description</div>'+
      '<div class="det-desc">'+esc(t.desc)+'</div>';
  }

  // Photos
  if(imgs.length){
    html += '<div class="det-section-title" style="margin-bottom:8px">Captures d\'écran</div>'+
      '<div class="photos-grid">'+
      imgs.map((img,i) =>
        '<div class="photo-thumb" onclick="openLightbox(\''+i+'\','+id+')"><img src="'+img.data+'" alt="capture"></div>'
      ).join('')+
      '</div><div style="margin-bottom:20px"></div>';
  }

  // Comments
  if(cmts.length){
    html += '<div class="det-section-title">Échanges ('+cmts.length+')</div>';
    html += cmts.map(c =>
      '<div class="cmt-item">'+
        '<div class="cmt-author">'+esc(c.author||'Équipe Kizeo')+'</div>'+
        '<div class="cmt-text">'+esc(c.text)+'</div>'+
        '<div class="cmt-date">'+timeAgo(c.date)+'</div>'+
      '</div>'
    ).join('');
  } else {
    html += '<div class="det-section-title">Échanges</div>'+
      '<div style="font-size:13px;color:var(--text3);font-style:italic;padding:10px 0">Aucun message pour l\'instant.</div>';
  }

  document.getElementById('det-content').innerHTML = html;
  document.getElementById('ov-det').classList.add('open');
}

function closeDet(){
  document.getElementById('ov-det').classList.remove('open');
}

function openLightbox(imgIdx, ticketId){
  const t = tickets.find(x => x.id === ticketId);
  if(!t||!t.images) return;
  const lb = document.createElement('div');
  lb.className = 'photo-lightbox';
  lb.innerHTML = '<img src="'+t.images[imgIdx].data+'">';
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}

// ── AUTO TOKEN FROM URL ──
function checkUrlToken(){
  const params = new URLSearchParams(window.location.search);
  const t = params.get('token');
  if(t){
    document.getElementById('access-token').value = t.toUpperCase();
  }
}

// ── INIT ──
checkUrlToken();
if(window._fbReady){
  checkSession();
} else {
  window.addEventListener('fb-ready', () => checkSession());
}
</script>
